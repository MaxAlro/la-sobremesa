<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Basta · La Sobremesa</title>
  <script src="../../nucleo/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Zilla+Slab:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../nucleo/tema.css">
  <link rel="stylesheet" href="../../nucleo/base.css">
  <script src="../../nucleo/vendor/qrcode.js"></script>
  <style>
    /* ---------- Celular, tablet o laptop de cada jugador ---------- */
    .jugador { max-width: 620px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; }
    .barra { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .barra .marca { font-size: 1.05rem; }
    .barra-der { display: flex; align-items: center; gap: 8px; }
    .codigo-mini { font-family: var(--fuente-titulo); font-weight: 700; color: var(--acento); letter-spacing: .12em; }
    .rol { border: 0; border-radius: 999px; padding: 5px 11px; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; background: var(--brillo-acento); color: var(--acento); }
    .envoltura-menu { position: relative; }
    .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 220px; display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 12px; background: var(--fondo-2); border: 1px solid var(--linea); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    .menu button { text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
    .menu button:hover { background: var(--superficie-2); }
    h1.titulo { font-size: 1.6rem; }
    h2.titulo { font-size: 1.9rem; }
    .sub { margin: 0; color: var(--suave); }
    .centrado { text-align: center; }
    .centro { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
    .espera { padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
    .espera p { margin: 0; color: var(--suave); }
    .aviso-local { margin: 0; font-size: .85rem; color: var(--suave); border: 1px dashed var(--linea); border-radius: 10px; padding: 10px; text-align: center; }
    .enlace { background: none; border: 0; color: var(--suave); text-decoration: underline; padding: 6px; font-size: .88rem; text-align: center; }
    .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--fuente-titulo); font-weight: 700; color: var(--tinta); }
    .insignia { font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--brillo-acento); color: var(--acento); flex: none; }
    .insignia.listo { background: var(--superficie-2); color: var(--listo); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .chip { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--superficie-2); color: var(--suave); }
    .chip.listo { background: var(--brillo-acento); color: var(--texto); }
    .pie-fijo { position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 5; }
    .pie-fijo .btn { width: 100%; box-shadow: 0 8px 22px rgba(0,0,0,.45); }

    /* Letra: carta de papel con la letra en grande */
    .letra-fila { display: flex; align-items: center; gap: 14px; }
    .letra-carta { flex: none; width: 84px; height: 100px; display: grid; place-items: center; font-family: var(--fuente-titulo); font-weight: 700; font-size: 4rem; line-height: 1; transform: rotate(-3deg); border: 2px solid var(--borde-acento); }
    .letra-carta.girando { color: var(--suave); }
    .letra-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .letra-info .reloj { font-family: var(--fuente-titulo); font-weight: 700; font-size: 1.3rem; color: var(--acento); }

    /* Hoja de respuestas */
    .hoja { display: flex; flex-direction: column; gap: 8px; }
    .renglon { display: flex; flex-direction: column; gap: 3px; }
    .renglon .etiqueta { display: flex; justify-content: space-between; gap: 8px; }
    .renglon .ojo { color: var(--peligro); text-transform: none; letter-spacing: 0; font-weight: 600; }
    .renglon .campo { font-size: 1.05rem; padding: 11px 12px; }
    .renglon.lleno .campo { border-color: var(--borde-acento); }
    .renglon.mal .campo { border-color: var(--peligro); }
    .campo:disabled { opacity: .6; }
    .btn.basta { font-size: 1.6rem; letter-spacing: .04em; padding: 14px 16px; }
    .cartel { padding: 14px 16px; border-radius: 14px; text-align: center; background: var(--brillo-acento); border: 2px solid var(--acento); }
    .cartel b { display: block; font-family: var(--fuente-titulo); font-size: 1.8rem; color: var(--acento); line-height: 1.1; }
    .cartel span { color: var(--texto); }
    .cartel.tranquilo { background: var(--superficie); border: 1px solid var(--linea); }
    .cartel.tranquilo b { font-size: 1.1rem; color: var(--texto); }

    /* Revisión de respuestas */
    .cabeza { display: flex; flex-direction: column; gap: 2px; }
    .respuestas { display: flex; flex-direction: column; gap: 8px; }
    .resp { display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--linea); }
    .resp.yo { border-color: var(--borde-acento); }
    .resp .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
    .resp .txt small { color: var(--suave); font-size: .75rem; }
    .resp .txt b { font-size: 1.1rem; overflow-wrap: anywhere; }
    .resp.cero .txt b { text-decoration: line-through; text-decoration-color: var(--peligro); color: var(--suave); }
    .resp.vacia .txt b { text-decoration: none; font-weight: 400; font-style: italic; }
    .resp .pts { display: flex; flex-direction: column; align-items: flex-end; flex: none; line-height: 1.1; }
    .resp .pts b { font-family: var(--fuente-titulo); font-size: 1.25rem; color: var(--listo); }
    .resp .pts small { font-size: .7rem; color: var(--suave); }
    .resp.repetida .pts b { color: var(--destacado); }
    .resp.cero .pts b { color: var(--peligro); }
    .voto { flex: none; padding: 6px 9px; font-size: .75rem; }
    .voto[aria-pressed="true"] { border-color: var(--peligro); color: var(--peligro); background: var(--superficie); }

    /* Resultados */
    .celebra { text-align: center; padding: 6px 0 2px; }
    .celebra h2 { font-size: 2rem; color: var(--destacado); }
    .celebra.mia h2 { color: var(--acento); }
    .mis { padding: 6px 12px; }
    .mi-fila { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--linea); }
    .mi-fila:last-child { border-bottom: 0; }
    .mi-fila small { color: var(--suave); width: 38%; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mi-fila span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .mi-fila b { font-family: var(--fuente-titulo); color: var(--listo); }
    .mi-fila b.cero { color: var(--peligro); }
    .mi-fila b.rep { color: var(--destacado); }
    .lista-puntos { display: flex; flex-direction: column; gap: 6px; }
    .fila-puntos { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--superficie); border: 1px solid var(--linea); }
    .fila-puntos.yo { border-color: var(--borde-acento); }
    .fila-puntos.fuera { opacity: .5; }
    .fila-puntos b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fila-puntos .mas { color: var(--listo); font-weight: 700; font-size: .9rem; }
    .fila-puntos .pts { font-family: var(--fuente-titulo); font-weight: 700; font-size: 1.2rem; color: var(--acento); min-width: 2.6em; text-align: right; }
    .puntos { padding: 0; }
    .puntos summary, .reglas summary { padding: 12px 14px; cursor: pointer; font-weight: 700; color: var(--suave); }
    .puntos .lista-puntos { padding: 0 10px 10px; }
    .reglas ol { margin: 0; padding: 0 18px 14px 34px; color: var(--suave); display: grid; gap: 6px; }

    /* Preparar la partida */
    .prep { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .cats { display: flex; flex-wrap: wrap; gap: 6px; }
    .cat { display: inline-flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 999px; background: var(--carta); color: var(--tinta); font-weight: 600; font-size: .92rem; }
    .cat button { border: 0; background: var(--tinta); color: var(--carta); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; line-height: 1; padding: 0; }
    .sugerencias { display: flex; flex-wrap: wrap; gap: 6px; }
    .sugerencias button { padding: 5px 10px; border-radius: 999px; border: 1px dashed var(--linea); background: none; color: var(--suave); font-size: .85rem; }
    .sugerencias button:hover { border-color: var(--borde-acento); color: var(--texto); }
    .agregar { display: flex; gap: 8px; }
    .agregar .campo { flex: 1; }
    .contador { display: flex; align-items: center; gap: 14px; }
    .contador b { font-family: var(--fuente-titulo); font-size: 1.6rem; min-width: 1.4em; text-align: center; }
    .contador .btn { width: 44px; height: 40px; font-size: 1.2rem; }
    .segmentos { display: flex; flex-wrap: wrap; gap: 6px; }
    .segmentos .btn[aria-pressed="true"] { border-color: var(--acento); color: var(--acento); }
    .interruptor { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--linea); cursor: pointer; }
    .interruptor input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--acento); flex: none; }
    .interruptor span { display: flex; flex-direction: column; }
    .interruptor small { color: var(--suave); font-size: .8rem; }

    /* ---------- Pantalla (tele, Chromecast o laptop) ----------
       CSS conservador para navegadores de tele: flexbox y vh/vw. */
    body.modo-pantalla { overflow: hidden; }
    .pantalla { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; padding: 4vh 4vw; }
    .p-arriba { display: flex; justify-content: space-between; align-items: center; font-size: 2.4vh; color: var(--suave); margin-bottom: 3vh; }
    .p-arriba .marca { font-size: 2.8vh; }
    .p-cuerpo { flex: 1; display: flex; min-height: 0; }
    .p-centro { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; margin-right: 4vw; }
    .p-lado { width: 26vw; display: flex; flex-direction: column; }
    .p-lado .etiqueta { font-size: 1.8vh; margin-bottom: 1.4vh; }
    .p-lado .fila-puntos { padding: 1.2vh 1.4vh; margin-bottom: 1vh; font-size: 2.6vh; border-radius: 1.2vh; gap: 1.2vh; }
    .p-lado .fila-puntos .pts { font-size: 3.2vh; }
    .p-lado .fila-puntos .mas { font-size: 2.2vh; }
    .p-lado .av { width: 4.4vh; height: 4.4vh; font-size: 2.2vh; }
    .p-lado .insignia { font-size: 1.5vh; padding: .4vh 1vh; }
    .p-lado .lista-puntos { gap: 0; }
    .p-titulo h1 { font-size: 9vh; }
    .p-titulo p { font-size: 3vh; color: var(--suave); margin: 2vh 0 0; }
    .p-titulo .etiqueta { font-size: 2vh; }
    .p-pie { margin-top: 3vh; font-size: 2.8vh; color: var(--suave); }
    .p-letra { display: flex; align-items: center; }
    .p-letra .letra-carta { width: 30vh; height: 36vh; font-size: 24vh; border-width: .5vh; border-radius: 2vh; margin-right: 5vh; }
    .p-letra .letra-info { gap: 1.4vh; }
    .p-letra .letra-info .etiqueta { font-size: 2.2vh; }
    .p-letra .letra-info h1 { font-size: 7vh; }
    .p-letra .letra-info .reloj { font-size: 6vh; }
    .p-cats { display: flex; flex-wrap: wrap; margin-top: 4vh; }
    .p-cats span { font-size: 2.8vh; padding: 1vh 2vh; margin: 0 1.2vh 1.2vh 0; border-radius: 999px; background: var(--superficie-2); }
    .p-cartel { margin-top: 3vh; padding: 2.4vh 3vh; border-radius: 2vh; background: var(--brillo-acento); border: .4vh solid var(--acento); }
    .p-cartel b { display: block; font-family: var(--fuente-titulo); font-size: 8vh; color: var(--acento); line-height: 1; }
    .p-cartel span { font-size: 3vh; }
    .p-cabeza .etiqueta { font-size: 2.2vh; }
    .p-cabeza h1 { font-size: 8vh; margin: 1vh 0 3vh; }
    .p-resps { display: flex; flex-wrap: wrap; align-content: flex-start; }
    .p-resp { width: calc(33.33% - 1.6vh); margin: 0 1.6vh 1.6vh 0; padding: 1.6vh 2vh; border-radius: 1.6vh; background: var(--carta); color: var(--tinta); display: flex; flex-direction: column; box-shadow: .3vh .4vh 0 rgba(0,0,0,.45); border-top: 1vh solid var(--tinta); }
    .p-resp small { font-size: 2vh; font-weight: 700; opacity: .7; }
    .p-resp b { font-family: var(--fuente-titulo); font-size: 4vh; line-height: 1.1; margin: .6vh 0; overflow-wrap: anywhere; }
    .p-resp i { font-style: normal; font-size: 2.2vh; font-weight: 700; }
    .p-resp.cero { opacity: .55; }
    .p-resp.cero b { text-decoration: line-through; }
    .p-resp.vacia b { font-style: italic; font-weight: 500; text-decoration: none; }
    .p-tabla { width: 100%; border-collapse: collapse; font-size: 2.6vh; }
    .p-tabla th { font-size: 1.8vh; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); font-weight: 700; padding: 1vh; text-align: center; }
    .p-tabla th:first-child, .p-tabla td:first-child { text-align: left; }
    .p-tabla td { padding: 1.2vh 1vh; text-align: center; border-top: 1px solid var(--linea); }
    .p-tabla td.cero { color: var(--peligro); opacity: .7; }
    .p-tabla td.rep { color: var(--destacado); }
    .p-tabla td.cien { color: var(--listo); }
    .p-tabla td.total { font-family: var(--fuente-titulo); font-weight: 700; color: var(--acento); font-size: 3.2vh; }
    .p-tabla .nom { display: flex; align-items: center; }
    .p-tabla .nom .av { width: 4vh; height: 4vh; font-size: 2vh; margin-right: 1.2vh; }
    .p-esquina { position: fixed; right: 2vw; bottom: 2.4vh; display: flex; align-items: center; padding: 1.2vh 1.6vh; border-radius: 1.4vh; background: var(--fondo-3); border: 1px solid var(--linea); opacity: .92; }
    .p-esquina canvas { width: 11vh; height: 11vh; border-radius: .8vh; image-rendering: pixelated; display: block; margin-right: 1.4vh; }
    .p-esquina div { display: flex; flex-direction: column; font-size: 1.7vh; color: var(--suave); line-height: 1.1; }
    .p-esquina b { font-family: var(--fuente-titulo); font-size: 4.4vh; letter-spacing: .14em; color: var(--acento); }
    @media (max-aspect-ratio: 1/1) {
      .pantalla { position: static; min-height: 100vh; }
      body.modo-pantalla { overflow: auto; }
      .p-cuerpo { flex-direction: column; }
      .p-centro { margin: 0 0 4vh; }
      .p-lado { width: auto; }
      .p-resp { width: calc(50% - 1.6vh); }
      .p-esquina { position: static; align-self: flex-end; margin-top: 3vh; }
    }
  </style>
</head>
<body>
  <div id="app"><div class="centro"><p class="sub">Abriendo el juego…</p></div></div>
  <div class="aviso" id="aviso" role="status"></div>
  <script type="module" src="juego.js"></script>
</body>
</html>
