<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>El impostor · La Sobremesa</title>
  <script src="../../nucleo/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Zilla+Slab:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../nucleo/tema.css">
  <link rel="stylesheet" href="../../nucleo/base.css">
  <script src="../../nucleo/vendor/qrcode.js"></script>
  <style>
    /* ---------- Celular, tablet o laptop de cada jugador ---------- */
    .jugador { max-width: 620px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; }
    .barra { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .barra .marca { font-size: 1.05rem; }
    .barra-der { display: flex; align-items: center; gap: 8px; }
    .codigo-mini { font-family: var(--fuente-titulo); font-weight: 700; color: var(--acento); letter-spacing: .12em; }
    .rol { border: 0; border-radius: 999px; padding: 5px 11px; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; background: var(--brillo-acento); color: var(--acento); }
    .envoltura-menu { position: relative; }
    .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 230px; display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 12px; background: var(--fondo-2); border: 1px solid var(--linea); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    .menu button { text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
    .menu button:hover { background: var(--superficie-2); }
    h1.titulo { font-size: 1.6rem; }
    h2.titulo { font-size: 1.8rem; }
    .sub { margin: 0; color: var(--suave); }
    .nota { margin: 0; font-size: .82rem; color: var(--suave); text-align: center; }
    .centrado { text-align: center; }
    .centro { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
    .espera { padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
    .espera p { margin: 0; color: var(--suave); }
    .enlace { background: none; border: 0; color: var(--suave); text-decoration: underline; padding: 6px; font-size: .88rem; text-align: center; }
    .cabeza { display: flex; flex-direction: column; gap: 2px; }
    .cabeza-fila { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
    .pildora { flex: none; font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--brillo-acento); color: var(--texto); }
    .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--fuente-titulo); font-weight: 700; color: var(--tinta); }
    .pie { margin-top: auto; display: flex; flex-direction: column; gap: 8px; position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 5; }
    .pie.suelto { position: static; margin-top: 4px; }
    .pie .btn.pri { box-shadow: 0 8px 22px rgba(0,0,0,.45); }
    .reglas { padding: 0; }
    .reglas summary { padding: 12px 14px; cursor: pointer; font-weight: 700; color: var(--suave); }
    .reglas ol, .reglas ul { margin: 0; padding: 0 18px 14px 34px; color: var(--suave); display: grid; gap: 6px; }
    .reglas p { margin: 0; padding: 0 14px 8px; font-weight: 700; color: var(--suave); }

    /* La tarjeta secreta: tapada se ve igual en todos los celulares; solo se destapa con el dedo encima */
    .carta-secreta { flex: 1; min-height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px 18px; border-radius: 22px; background: var(--carta); color: var(--tinta); border: 4px solid var(--borde-acento); box-shadow: 4px 6px 0 rgba(0,0,0,.45); text-align: center; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .carta-secreta:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; }
    .carta-secreta .tapa, .carta-secreta .cara { display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; }
    .carta-secreta .cara { display: none; }
    body.viendo-carta .carta-secreta .tapa { display: none; }
    body.viendo-carta .carta-secreta .cara { display: flex; }
    .tapa .signo { font-family: var(--fuente-titulo); font-weight: 700; font-size: 6rem; line-height: 1; color: var(--acento-en-carta); }
    .tapa b { font-family: var(--fuente-titulo); font-size: 1.3rem; }
    .tapa small { color: var(--tinta-suave); font-size: .95rem; }
    .cara .rol-carta { font-family: var(--fuente-titulo); font-weight: 700; font-size: 2.4rem; line-height: 1; letter-spacing: .08em; text-transform: uppercase; color: var(--acento-en-carta); }
    .cara .lbl { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--tinta-suave); }
    .cara .pal { font-family: var(--fuente-titulo); font-weight: 700; font-size: 3.2rem; line-height: 1.05; overflow-wrap: anywhere; }
    .cara .pal.t1 { font-size: 2.7rem; }
    .cara .pal.t2 { font-size: 2.3rem; }
    .cara .pal.t3 { font-size: 1.9rem; }
    .cara .desc { max-width: 300px; font-size: .95rem; line-height: 1.35; color: var(--tinta-suave); }
    .vistazo { display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); background: var(--fondo-3); flex-direction: column; }
    body.viendo-carta .vistazo { display: flex; }
    .ver-palabra { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }

    /* Listas de jugadores: orden de pistas y votos */
    .orden { display: flex; flex-direction: column; gap: 6px; }
    .turno { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--linea); }
    .turno .num { width: 1.4em; text-align: center; font-family: var(--fuente-titulo); font-weight: 700; color: var(--suave); }
    .turno b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .turno small { font-weight: 700; color: var(--suave); }
    .turno.hecha small { color: var(--listo); }
    .turno.ahora { background: var(--brillo-acento); border-color: var(--acento); }
    .turno.ahora small { color: var(--acento); }
    .opciones { display: flex; flex-direction: column; gap: 8px; }
    .opcion-voto { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--superficie); border: 1px solid var(--linea); text-align: left; font-size: 1.05rem; }
    .opcion-voto b { flex: 1; min-width: 0; }
    .opcion-voto small { font-weight: 700; color: var(--acento); }
    .opcion-voto[aria-pressed="true"] { background: var(--brillo-acento); border-color: var(--acento); }
    .opcion-voto .av { width: 36px; height: 36px; }
    .votos { display: flex; flex-direction: column; gap: 10px; }
    .voto-fila { display: flex; flex-direction: column; gap: 4px; }
    .voto-fila .arriba { display: flex; align-items: center; gap: 10px; }
    .voto-fila .arriba b { flex: 1; }
    .voto-fila .arriba .n { font-family: var(--fuente-titulo); font-size: 1.3rem; }
    .voto-fila .barra-voto { height: 8px; border-radius: 999px; background: var(--superficie-2); overflow: hidden; }
    .voto-fila .barra-voto i { display: block; height: 100%; background: var(--suave); border-radius: 999px; }
    .voto-fila.fuera .barra-voto i { background: var(--acento); }
    .voto-fila.fuera .arriba .n { color: var(--acento); }
    .voto-fila small { color: var(--suave); font-size: .82rem; }

    /* Adivinar y resultados */
    .resumen { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
    .resumen h2 { font-size: 1.8rem; }
    .resumen .mas { color: var(--listo); }
    .palabra-final { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 16px; text-align: center; border: 3px solid var(--borde-acento); border-radius: 18px; }
    .palabra-final .lbl { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--tinta-suave); }
    .palabra-final b { font-family: var(--fuente-titulo); font-size: 2.4rem; line-height: 1; }
    .palabra-final span { font-size: .92rem; line-height: 1.35; color: var(--tinta-suave); }
    .palabra-final hr { width: 60%; border: 0; border-top: 1px solid var(--tinta-suave); opacity: .4; margin: 6px 0; }
    .lineas { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; color: var(--suave); }
    .lineas b { color: var(--texto); }
    .lista-puntos { display: flex; flex-direction: column; gap: 6px; }
    .fila-puntos { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; background: var(--superficie); border: 1px solid var(--linea); }
    .fila-puntos.yo { border-color: var(--borde-acento); }
    .fila-puntos.fuera { opacity: .5; }
    .fila-puntos .nom { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
    .fila-puntos .nom b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fila-puntos .nom small { color: var(--suave); font-size: .75rem; }
    .fila-puntos .ronda { font-family: var(--fuente-titulo); font-weight: 700; color: var(--suave); min-width: 2em; text-align: right; }
    .fila-puntos .ronda.suma { color: var(--listo); }
    .fila-puntos .pts { font-family: var(--fuente-titulo); font-weight: 700; font-size: 1.2rem; color: var(--acento); min-width: 2em; text-align: right; }
    .corregir { display: flex; flex-direction: column; gap: 6px; padding: 12px; }
    .corregir p { margin: 0; font-size: .9rem; color: var(--suave); }

    /* Preparar la partida */
    .prep { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .mazos { display: flex; flex-wrap: wrap; gap: 6px; }
    .mazo-chip { padding: 6px 11px; border-radius: 999px; font-size: .88rem; font-weight: 600; border: 1px dashed var(--linea); background: none; color: var(--suave); }
    .mazo-chip[aria-pressed="true"] { border: 1px solid var(--carta); background: var(--carta); color: var(--tinta); }
    .segmentos { display: flex; gap: 6px; }
    .segmentos .btn { flex: 1; padding: 8px 10px; }
    .segmentos .btn[aria-pressed="true"] { border-color: var(--acento); color: var(--acento); background: var(--brillo-acento); }
    .modo { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--linea); cursor: pointer; }
    .modo input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--acento); flex: none; }
    .modo span { display: flex; flex-direction: column; }
    .modo small { color: var(--suave); font-size: .8rem; }
    .modo.on { background: var(--brillo-acento); border-color: var(--acento); }
    .modo.no { opacity: .55; cursor: not-allowed; }
    .campo-adivina { font-size: 1.3rem; padding: 14px; }

    /* ---------- Pantalla (tele, Chromecast o laptop) ----------
       CSS conservador para navegadores de tele: flexbox y vh/vw. */
    body.modo-pantalla { overflow: hidden; }
    .pantalla { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; padding: 4vh 4vw; }
    .p-arriba { display: flex; justify-content: space-between; align-items: center; font-size: 2.4vh; color: var(--suave); margin-bottom: 2vh; }
    .p-arriba .marca { font-size: 2.8vh; }
    .p-cuerpo { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
    .p-cuerpo .etiqueta { font-size: 2.2vh; }
    .p-titulo { font-family: var(--fuente-titulo); font-weight: 700; line-height: 1.05; margin: 1vh 0; }
    .p-sub { font-size: 3.6vh; color: var(--suave); margin: 0; }
    .p-sub b { color: var(--texto); }
    .p-portada { display: flex; align-items: center; }
    .p-mini { position: relative; width: 40vh; height: 44vh; flex: none; margin-right: 8vh; }
    .p-mini div { position: absolute; width: 29vh; height: 37vh; border-radius: 2.4vh; display: flex; align-items: center; justify-content: center; font-family: var(--fuente-titulo); font-weight: 700; box-shadow: .5vh .8vh 0 rgba(0,0,0,.45); }
    .p-mini .uno { left: 0; top: 3vh; background: var(--carta); color: var(--tinta); border: .5vh solid var(--linea); transform: rotate(-9deg); font-size: 3.4vh; align-items: flex-start; justify-content: flex-start; padding: 3vh; box-sizing: border-box; }
    .p-mini .dos { left: 11vh; top: 4vh; background: var(--tinta); color: var(--acento); border: .5vh solid var(--borde-acento); transform: rotate(5deg); font-size: 22vh; line-height: 1; }
    .p-pasos { display: flex; flex-direction: column; margin-top: 2vh; font-size: 3vh; }
    .p-pasos span { margin-bottom: 1.2vh; }
    .p-pasos b { color: var(--acento); }
    .p-pie { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2vh; }
    .p-fila { display: flex; flex-wrap: wrap; }
    .p-jug { display: flex; flex-direction: column; align-items: center; width: 12vh; margin-right: 1.6vh; text-align: center; }
    .p-jug .av { width: 8vh; height: 8vh; font-size: 3.4vh; border: .4vh solid transparent; }
    .p-jug span { font-size: 2.2vh; margin-top: .6vh; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-jug small { font-size: 1.8vh; font-weight: 700; color: var(--suave); }
    .p-jug.no { opacity: .55; }
    .p-jug.si .av { border-color: var(--listo); }
    .p-jug.si small { color: var(--listo); }
    .p-pildora { font-size: 3vh; padding: 1vh 2.4vh; border-radius: 999px; background: var(--brillo-acento); white-space: nowrap; }
    .p-orden { display: flex; flex-wrap: wrap; margin-top: 4vh; }
    .p-turno { display: flex; align-items: center; width: calc(33.33% - 2vh); margin: 0 2vh 2vh 0; padding: 1.6vh 2vh; border-radius: 1.6vh; background: var(--superficie); border: .3vh solid var(--linea); }
    .p-turno .num { font-family: var(--fuente-titulo); font-weight: 700; font-size: 3vh; color: var(--suave); width: 4vh; }
    .p-turno .av { width: 6vh; height: 6vh; font-size: 2.8vh; margin-right: 1.6vh; }
    .p-turno div { display: flex; flex-direction: column; min-width: 0; }
    .p-turno b { font-size: 3vh; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-turno small { font-size: 2vh; font-weight: 700; color: var(--suave); }
    .p-turno.hecha small { color: var(--listo); }
    .p-turno.ahora { background: var(--brillo-acento); border-color: var(--acento); }
    .p-turno.ahora small { color: var(--acento); }
    .p-reloj { display: flex; flex-direction: column; align-items: flex-end; }
    .p-reloj b { font-family: var(--fuente-titulo); font-size: 14vh; line-height: 1; color: var(--acento); }
    .p-reloj small { font-size: 2.4vh; color: var(--suave); }
    .p-dos { display: flex; align-items: center; }
    .p-dos > div:first-child { width: 42%; flex: none; margin-right: 6vw; }
    .p-dos > div:last-child { flex: 1; min-width: 0; }
    .p-votos .voto-fila { margin-bottom: 2.4vh; }
    .p-votos .voto-fila .arriba { font-size: 3vh; }
    .p-votos .voto-fila .arriba .n { font-size: 4vh; }
    .p-votos .voto-fila .av { width: 5.4vh; height: 5.4vh; font-size: 2.6vh; }
    .p-votos .voto-fila .barra-voto { height: 1.4vh; }
    .p-votos .voto-fila small { font-size: 2.2vh; }
    .p-palabra { display: flex; flex-direction: column; align-items: center; padding: 4vh 3vh; border-radius: 2.4vh; background: var(--carta); color: var(--tinta); border: .5vh solid var(--borde-acento); transform: rotate(-3deg); box-shadow: .5vh .8vh 0 rgba(0,0,0,.45); text-align: center; }
    .p-palabra .lbl { font-size: 2vh; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--tinta-suave); }
    .p-palabra b { font-family: var(--fuente-titulo); font-size: 9vh; line-height: 1; margin: 1vh 0; }
    .p-palabra span { font-size: 2.3vh; line-height: 1.35; color: var(--tinta-suave); }
    .p-palabra hr { width: 60%; border: 0; border-top: .2vh solid var(--tinta-suave); opacity: .4; margin: 2vh 0 1.4vh; }
    .p-palabra .chica { font-size: 5vh; }
    .p-lineas { margin: 3vh 0 0; padding: 0; list-style: none; font-size: 2.8vh; color: var(--suave); }
    .p-lineas li { margin-bottom: 1vh; }
    .p-lineas b { color: var(--texto); }
    .p-tabla { width: 100%; border-collapse: collapse; font-size: 2.8vh; }
    .p-tabla th { font-size: 1.8vh; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); font-weight: 700; padding: 1vh 1.4vh; text-align: right; }
    .p-tabla td { padding: 1.2vh 1.4vh; text-align: right; border-top: 1px solid var(--linea); }
    .p-tabla th:first-child, .p-tabla td:first-child, .p-tabla th:nth-child(2), .p-tabla td:nth-child(2) { text-align: left; }
    .p-tabla td:nth-child(2) { color: var(--suave); font-size: 2.3vh; }
    .p-tabla td.suma { color: var(--listo); font-family: var(--fuente-titulo); font-weight: 700; }
    .p-tabla td.cero { color: var(--suave); font-family: var(--fuente-titulo); font-weight: 700; }
    .p-tabla td.total { font-family: var(--fuente-titulo); font-weight: 700; color: var(--acento); font-size: 3.4vh; }
    .p-tabla .nom { display: flex; align-items: center; font-weight: 700; }
    .p-tabla .nom .av { width: 4.6vh; height: 4.6vh; font-size: 2.2vh; margin-right: 1.4vh; }
    .p-esquina { position: fixed; right: 2vw; bottom: 2.4vh; display: flex; align-items: center; padding: 1.2vh 1.6vh; border-radius: 1.4vh; background: var(--fondo-3); border: 1px solid var(--linea); opacity: .92; }
    .p-esquina canvas { width: 11vh; height: 11vh; border-radius: .8vh; image-rendering: pixelated; display: block; margin-right: 1.4vh; }
    .p-esquina div { display: flex; flex-direction: column; font-size: 1.7vh; color: var(--suave); line-height: 1.1; }
    .p-esquina b { font-family: var(--fuente-titulo); font-size: 4.4vh; letter-spacing: .14em; color: var(--acento); }
    @media (max-aspect-ratio: 1/1) {
      .pantalla { position: static; min-height: 100vh; }
      body.modo-pantalla { overflow: auto; }
      .p-portada, .p-dos { flex-direction: column; align-items: stretch; }
      .p-mini { margin: 0 auto 4vh; }
      .p-dos > div:first-child { width: auto; margin: 0 0 4vh; }
      .p-turno { width: calc(50% - 2vh); }
      .p-esquina { position: static; align-self: flex-end; margin-top: 3vh; }
    }
  </style>
</head>
<body>
  <div id="app"><div class="centro"><p class="sub">Abriendo el juego…</p></div></div>
  <div class="aviso" id="aviso" role="status"></div>
  <script type="module" src="juego.js"></script>
</body>
</html>
